<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <title>Explore Himachal — Nirvana Inside</title>
  <meta name="description" content="Browse stays, taxis, experiences, rentals and tour packages across Himachal Pradesh, then enquire on WhatsApp for the best price.">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/forms.js" defer></script>
  <script src="/js/explore.js" defer></script>
</head>
<body data-solid="1">
  <main id="main">
    <section class="page-top"><div class="wrap">
      <p class="eyebrow mono" id="ex-eyebrow">Explore</p>
      <h1 id="ex-title">Explore</h1>
      <p id="ex-sub"></p>
      <div class="console" style="margin-top:22px"><div class="panel" id="ex-form"></div></div>
    </div></section>

    <section style="padding-bottom:60px"><div class="wrap">
      <div class="toolbar">
        <div class="chips" id="ex-chips" role="toolbar" aria-label="Filter"></div>
        <input class="search-in" id="ex-q" type="search" placeholder="Search by name or place…" aria-label="Search listings">
      </div>
      <div class="split">
        <div><p class="mono muted" id="ex-count" style="margin-bottom:12px"></p><div class="cards" id="ex-grid"></div></div>
        <div class="map" id="ex-map" role="region" aria-label="Map"></div>
      </div>
    </div></section>
  </main>
  <div class="mobile-bar"><a class="btn btn-ghost btn-sm" href="tel:+917220080005">📞 Call</a><button class="btn btn-wa btn-sm" type="button" data-enquire="general">WhatsApp us</button></div>
</body>
</html>
